# Source feeds for the semiconductor capital equipment news digest.
# Add new sources here without touching code. Each source needs:
#   name      - human-readable label (shown in logs and the digest footer)
#   url       - RSS/Atom feed URL
#   category  - one of: company | tech | policy | business | opinion
#   priority  - 1 (high) to 3 (low); tiebreaker when ranking
#
# Note on company press feeds: several key equipment makers (KLA, Onto, ASML)
# and SEMI.org don't publish stable RSS for their newsroom anymore. We pull
# those directly with the HTML-scrape adapter (kind = "scrape"); see the
# "Company newsrooms" section at the bottom of this file. We still also catch
# them indirectly via trade press and HN keyword filters.

# ---------------------------------------------------------------------------
# Trade press — the workhorses; rich in tech detail
# ---------------------------------------------------------------------------

[[sources]]
name = "SemiWiki"
url = "https://semiwiki.com/feed/"
category = "tech"
priority = 1

[[sources]]
name = "Semiconductor Engineering"
url = "https://semiengineering.com/feed/"
category = "tech"
priority = 1

[[sources]]
name = "EE Times"
url = "https://www.eetimes.com/feed/"
category = "tech"
priority = 2

[[sources]]
name = "Bits & Chips"
url = "https://bits-chips.com/feed/"
category = "tech"
priority = 1

[[sources]]
name = "Tom's Hardware"
url = "https://www.tomshardware.com/feeds/all"
category = "tech"
priority = 3

[[sources]]
name = "Semiconductor Digest"
url = "https://www.semiconductor-digest.com/feed/"
category = "tech"
priority = 2

[[sources]]
name = "EE Journal (Semiconductor)"
url = "https://www.eejournal.com/category/semiconductor/feed/"
category = "tech"
priority = 2

[[sources]]
name = "AnySilicon"
url = "https://anysilicon.com/feed/"
category = "tech"
priority = 3

# Tech Xplore is a research-news aggregator — broad and noisy; the relevance
# ranker does the culling. Low priority so it loses ties to focused sources.
[[sources]]
name = "Tech Xplore (Semiconductors)"
url = "https://techxplore.com/rss-feed/semiconductors-news/"
category = "tech"
priority = 3

# ---------------------------------------------------------------------------
# Industry wire / Asia supply chain — fab capacity, tool orders, foundry moves
# DIGITIMES is largely paywalled, but its RSS headlines are high-signal on
# their own (the ranker scores on the headline when the body is gated).
# ---------------------------------------------------------------------------

[[sources]]
name = "DIGITIMES"
url = "https://www.digitimes.com/rss/daily.xml"
category = "business"
priority = 1

[[sources]]
name = "Evertiq"
url = "https://feeds2.feedburner.com/EvertiqCom/All"
category = "business"
priority = 3

# ---------------------------------------------------------------------------
# HN keyword filters — surprisingly high-signal for semi equipment news
# hnrss.org is a free service that turns HN searches into RSS feeds.
# The relevance ranker will filter out the noise.
# ---------------------------------------------------------------------------

# The Elec: English-language Korean supply-chain coverage (Samsung / SK hynix
# tool orders, Korean equipment makers) — a beat no other source here carries.
[[sources]]
name = "The Elec (Korea semiconductor)"
url = "https://www.thelec.net/rss/allArticle.xml"
category = "company"
priority = 2

# TrendForce press center: market-research angle (memory pricing, fab capacity,
# capex forecasts).
[[sources]]
name = "TrendForce (Semiconductors)"
url = "https://www.trendforce.com/feed/Semiconductors.html"
category = "business"
priority = 2

# Nikon corporate news — the only litho-adjacent maker with a working RSS feed;
# covers Nikon Precision (litho) alongside imaging (ranker filters the rest).
[[sources]]
name = "Nikon (corporate news)"
url = "https://www.nikon.com/company/rss/feeds/news.rss"
category = "company"
priority = 2

# EU Commission DG Trade: the EU-side counterpart of the Federal Register
# source for export-control / trade-instrument news. General trade feed, so
# most items are off-topic — the ranker filters.
[[sources]]
name = "EU Commission (DG Trade)"
url = "https://policy.trade.ec.europa.eu/node/2/rss_en"
category = "policy"
priority = 3

# Hacker News keyword coverage now goes through the Algolia HN Search API
# (kind = "hn_algolia") instead of the hnrss.org bridge, which 502'd in 3 of 4
# observed runs and silently zeroed ALL keyword coverage when it did. Each
# entry runs one API call per query; queries are single keywords/phrases (the
# adapter dedupes overlapping hits by URL).

[[sources]]
name = "Hacker News (equipment & lithography)"
url = "https://hn.algolia.com/api/v1/search_by_date"
category = "tech"
priority = 1
kind = "hn_algolia"
options = { min_points = 5, queries = ["ASML", "KLA", "lithography", "EUV", "Lam Research", "Applied Materials"] }

[[sources]]
name = "Hacker News (fabs & chip policy)"
url = "https://hn.algolia.com/api/v1/search_by_date"
category = "policy"
priority = 2
kind = "hn_algolia"
options = { min_points = 5, queries = ["TSMC fab", "Samsung foundry", "Intel foundry", "export controls semiconductor", "CHIPS Act", "Taiwan chip"] }

# Google News aggregation for the export-control beat: catches the policy/legal
# outlets (think-tank analyses, national press) that have no usable RSS of
# their own. NOTE: item links are news.google.com redirects, so full-text
# enrichment usually fails and the ranker scores on the headline — acceptable
# for a discovery feed.
[[sources]]
name = "Google News (chip export controls)"
url = "https://news.google.com/rss/search?q=%22export+controls%22+semiconductor&hl=en-US&gl=US&ceid=US:en"
category = "policy"
priority = 2

# ---------------------------------------------------------------------------
# Opinion & analysis — independent commentary, not straight reporting.
# YouTube channel uploads arrive as Atom feeds; items are titles + video links
# (no transcript), so they rank on the headline. Both channels are
# industry-commentary heavy; the ranker drops the off-topic remainder.
# Both Substacks publish FULL article text in RSS for free posts; paid /
